<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linko | Encurtador de links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="Topo">
        <a class="brand" href="#" aria-label="Linko">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M20.6 29.4 16.4 33.6a6.8 6.8 0 0 1-9.6-9.6l6.9-6.9a6.8 6.8 0 0 1 9.7 0" />
              <path d="M27.4 18.6 31.6 14.4a6.8 6.8 0 0 1 9.6 9.6l-6.9 6.9a6.8 6.8 0 0 1-9.7 0" />
              <path d="m17.8 30.2 12.4-12.4" />
            </svg>
          </span>
          <span>Linko</span>
        </a>

        <div class="theme-actions" aria-label="Tema">
          <button class="icon-button ghost" type="button" data-theme="light" aria-label="Tema claro" title="Tema claro">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </button>
          <button class="icon-button active" type="button" data-theme="dark" aria-label="Tema escuro" title="Tema escuro">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.6 2.2a8.8 8.8 0 1 0 9.2 9.2 7 7 0 1 1-9.2-9.2Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title"><span>Links menores.</span> Simples assim.</h1>
        <p>Cole uma URL e transforme em um link curto.</p>
      </section>

      <form class="shorten-form" id="shortenForm" novalidate>
        <label class="input-wrap" for="urlInput">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input id="urlInput" type="url" placeholder="Cole aqui um link longo..." autocomplete="url" spellcheck="false" />
        </label>
        <button class="primary-button" id="shortenButton" type="submit">
          <span>Encurtar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

      <section class="result-card hidden" id="resultCard" aria-live="polite">
        <div class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="m20 6-11 11-5-5"></path>
          </svg>
        </div>
        <div class="result-content">
          <p class="eyebrow">Seu link está pronto!</p>
          <a class="short-link" id="shortLink" href="#" target="_blank" rel="noreferrer"></a>
          <p class="copy-state hidden" id="copyState">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m20 6-11 11-5-5"></path>
            </svg>
            Copiado!
          </p>
        </div>
        <button class="secondary-button" id="copyLatest" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copiar</span>
        </button>
      </section>

      <section class="history-section" aria-labelledby="historyTitle">
        <div class="section-title">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 8v5l3 2"></path>
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
          </span>
          <h2 id="historyTitle">Links recentes</h2>
        </div>

        <div class="history-list" id="historyList"></div>

        <button class="clear-button" id="clearHistory" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="m19 6-.8 14.2A2 2 0 0 1 16.2 22H7.8a2 2 0 0 1-2-1.8L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
          <span>Limpar histórico</span>
        </button>
      </section>

      <footer>Feito com <span aria-hidden="true">♥</span> para praticar e compartilhar.</footer>
    </main>

    <template id="historyItemTemplate">
      <article class="history-item">
        <span class="mini-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </span>
        <a class="original-url" target="_blank" rel="noreferrer"></a>
        <span class="arrow" aria-hidden="true">→</span>
        <a class="history-short" target="_blank" rel="noreferrer"></a>
        <button class="copy-small" type="button" aria-label="Copiar link curto" title="Copiar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
